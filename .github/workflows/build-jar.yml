name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: pigbuilder

    - name: Force Build with Gradle
      run: ./gradlew jar --no-daemon -x test -x check
      working-directory: pigbuilder

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-jar
        path: pigbuilder/build/libs/*.jar
