name: Build Minecraft Mod

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17' # Change to '16' or '8' if you are building for an older Minecraft version
        distribution: 'temurin'

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew
      working-directory: pigbuilder

    - name: Build Mod with Gradle
      run: ./gradlew build -x test
      working-directory: pigbuilder

    - name: Upload Mod JAR
      uses: actions/upload-artifact@v4
      with:
        name: minecraft-mod-jar
        path: pigbuilder/build/libs/*.jar
