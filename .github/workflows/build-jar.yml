name: Build Java JAR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Build Directory
      run: mkdir -p out

    - name: Compile Java Files
      run: |
        find pigbuilder -name "*.java" > sources.txt
        if [ -s sources.txt ]; then
          javac -d out @sources.txt
        else
          echo "No .java files found in pigbuilder directory!" && exit 1
        fi

    - name: Create JAR File
      run: jar cvf app.jar -C out .

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: compiled-jar-file
        path: app.jar
